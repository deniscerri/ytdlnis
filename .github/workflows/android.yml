name: Android CI & Release

env:
  main_project_module: app

permissions:
  contents: write

on:
  push:
    branches:
      - "**"
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  # Fetch translator credits once and share them with every flavor build.
  translators:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Fetch translators from Weblate
        continue-on-error: true
        run: python3 scripts/fetch_translators.py translators.json

      - name: Upload translators.json
        if: hashFiles('translators.json') != ''
        uses: actions/upload-artifact@v4
        with:
          name: translators-json
          path: translators.json

  build:
    needs: translators
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: read

    strategy:
      fail-fast: false
      matrix:
        include:
          - flavor: github
            task: assembleGithubRelease
            display_name: github
          - flavor: foss
            task: assembleFossRelease
            display_name: FOSS
          - flavor: izzy
            task: assembleIzzyRelease
            display_name: Izzy

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: 'corretto'
          cache: 'gradle'

      - name: Download translators.json
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: translators-json
          path: app/src/main/assets

      - name: Configure Keystore & Properties
        run: |
          mkdir -p app
          if [ -n "${{ secrets.BASE_64_SIGNING_KEY }}" ]; then
            echo "${{ secrets.BASE_64_SIGNING_KEY }}" | base64 -d > app/release_keystore.jks
          fi
          touch local.properties
          touch keystore.properties
          if [ -n "${{ secrets.LOCAL_PROPERTIES }}" ]; then
            echo "${{ secrets.LOCAL_PROPERTIES }}" > keystore.properties
          fi
          chmod +x gradlew

      # Build flavor APK release
      - name: Build ${{ matrix.flavor }} APK release
        run: ./gradlew ${{ matrix.task }} --warning-mode all || ./gradlew assemble${{ matrix.flavor }}Debug --warning-mode all

      # Upload individual ABI artifacts for this runner's flavor
      - name: Upload arm64
        uses: actions/upload-artifact@v4
        with:
          name: ytdlnis-arm64-v8a-${{ matrix.flavor }}
          path: ${{ env.main_project_module }}/build/outputs/apk/${{ matrix.flavor }}/*/*arm64*.apk

      - name: Upload armeabiv7
        uses: actions/upload-artifact@v4
        with:
          name: ytdlnis-armeabi-v7a-${{ matrix.flavor }}
          path: ${{ env.main_project_module }}/build/outputs/apk/${{ matrix.flavor }}/*/*armeabi*.apk

      - name: Upload universal
        uses: actions/upload-artifact@v4
        with:
          name: ytdlnis-universal-${{ matrix.flavor }}
          path: ${{ env.main_project_module }}/build/outputs/apk/${{ matrix.flavor }}/*/*universal*.apk

      - name: Upload x86
        uses: actions/upload-artifact@v4
        with:
          name: ytdlnis-x86-${{ matrix.flavor }}
          path: ${{ env.main_project_module }}/build/outputs/apk/${{ matrix.flavor }}/*/*x86-*.apk

      - name: Upload x86_64
        uses: actions/upload-artifact@v4
        with:
          name: ytdlnis-x86_64-${{ matrix.flavor }}
          path: ${{ env.main_project_module }}/build/outputs/apk/${{ matrix.flavor }}/*/*x86_64*.apk

      - name: Upload Full Folder
        uses: actions/upload-artifact@v4
        with:
          name: YTDLnis-APK-${{ matrix.display_name }}
          path: ${{ env.main_project_module }}/build/outputs/apk/${{ matrix.flavor }}/

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all APK artifacts
        uses: actions/download-artifact@v4
        with:
          path: apks

      - name: Create GitHub Release with APKs
        uses: softprops/action-gh-release@v2
        with:
          files: apks/**/*.apk
          generate_release_notes: true

  notify:
    needs: build
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Send Telegram Message
        continue-on-error: true
        uses: appleboy/telegram-action@master
        with:
          to: ${{ secrets.TELEGRAM_TO }}
          token: ${{ secrets.TELEGRAM_TOKEN }}
          message: |
            ${{ github.actor }} created commit:
            Commit message: ${{ github.event.commits[0].message }}
            Repository: ${{ github.repository }}
            See changes: https://github.com/${{ github.repository }}/commit/${{ github.sha }}
