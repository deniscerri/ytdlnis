name: Telegram Builder

on:
  release:
    types: [published]

jobs:
  notify:
    name: Notify Telegram
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Send release to Telegram
        shell: bash
        env:
          TG_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TG_TO: ${{ secrets.TELEGRAM_TO }}
          TAG: ${{ github.event.release.tag_name }}
          REPO: ${{ github.repository }}
          BODY: ${{ github.event.release.body }}
          ASSETS: ${{ toJSON(github.event.release.assets) }}
        run: |
          set -euo pipefail
          API="https://api.telegram.org/bot${TG_TOKEN}"
          MAX_LENGTH=2500

          # Truncate the release notes, then escape for Telegram HTML mode
          if [ ${#BODY} -gt $MAX_LENGTH ]; then
            BODY="${BODY:0:$MAX_LENGTH}... (truncated)"
          fi
          BODY_ESCAPED=$(printf '%s' "$BODY" | tr -d '\r' | sed 's/&/\&amp;/g; s/</\&lt;/g; s/>/\&gt;/g')

          # Only the github flavour apks
          LINKS=$(echo "$ASSETS" | jq -r '
            .[]
            | select(.name | test("-github.*\\.apk$"))
            | "<a href=\"\(.browser_download_url)\">\(.name)</a>"')

          MESSAGE="YTDLnis has a new release: <a href=\"https://github.com/${REPO}/releases/tag/${TAG}\">${TAG}</a>

          <pre>${BODY_ESCAPED}</pre>

          ${LINKS}"

          # 1) Photo (no caption, so no 1024 char limit)
          curl -sS --fail-with-body "${API}/sendPhoto" \
            -d chat_id="${TG_TO}" \
            -d photo="https://raw.githubusercontent.com/deniscerri/ytdlnis/main/app/src/main/ic_launcher-playstore.png"

          # 2) Release message
          curl -sS --fail-with-body "${API}/sendMessage" \
            -d chat_id="${TG_TO}" \
            -d parse_mode="HTML" \
            -d disable_web_page_preview="true" \
            --data-urlencode text="${MESSAGE}"